name: CI (Fast)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css123
          POSTGRES_DB: creativesoundstudio
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U css -d creativesoundstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries: 10
    env:
      DATABASE_URL: postgresql://css:css123@localhost:5432/creativesoundstudio
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-secret
      MAGIC_LINK_TTL_HOURS: "168"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend