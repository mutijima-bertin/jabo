name: CI (Fast)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://css:css123@localhost:5432/creativesoundstudio
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-secret
      MAGIC_LINK_TTL_HOURS: "168"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start Postgres
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=css \
            -e POSTGRES_PASSWORD=css123 \
            -e POSTGRES_DB=creativesoundstudio \
            -p 5432:5432 \
            postgres:16-alpine
          # Wait for postgres to be ready
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U css -d creativesoundstudio >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres failed to start"
          docker logs postgres
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend