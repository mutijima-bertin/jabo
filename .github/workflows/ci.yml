name: CI (Fast)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://css:css123@localhost:5432/creativesoundstudio
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-secret
      MAGIC_LINK_TTL_HOURS: "168"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start Postgres
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=css \
            -e POSTGRES_PASSWORD=css123 \
            -e POSTGRES_DB=creativesoundstudio \
            -p 5432:5432 \
            postgres:16-alpine
          # Wait for postgres to be ready
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U css -d creativesoundstudio >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres failed to start"
          docker logs postgres
          exit 1
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # -----------------------------------------------------------------------
  # Docker-build guarantee: proves the compose build works on every push/PR.
  # Does NOT run the full stack — that's the nightly job's job.
  # -----------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose.yml
        env:
          # Required by compose's ${ADMIN_EMAIL:?…} / ${JWT_SECRET:?…}
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password
          JWT_SECRET: ci-secret
        run: docker compose config --quiet
      - name: Build backend and frontend images
        env:
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password
          JWT_SECRET: ci-secret
        run: docker compose build backend frontend

  # -----------------------------------------------------------------------
  # GHCR publish: pushes images on every merge to main.
  # Non-blocking (continue-on-error) so a permissions / network issue never
  # fails the commit check — CI stays green.  If it passes, you get real
  # Docker release tags at ghcr.io/<owner>/jabo-backend and jabo-frontend.
  # -----------------------------------------------------------------------
  publish-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true   # non-blocking: GHCR push failure won't fail CI on main
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Build with explicit tags straight from the compose build contexts
      # (./backend + ./frontend, same Dockerfiles) — no compose-name inference.
      - name: Build backend image
        run: |
          docker build \
            -t "ghcr.io/${{ github.repository_owner }}/jabo-backend:main" \
            -t "ghcr.io/${{ github.repository_owner }}/jabo-backend:sha-${GITHUB_SHA::7}" \
            ./backend
      - name: Build frontend image
        run: |
          docker build \
            --build-arg BACKEND_URL=http://backend:4000 \
            -t "ghcr.io/${{ github.repository_owner }}/jabo-frontend:main" \
            -t "ghcr.io/${{ github.repository_owner }}/jabo-frontend:sha-${GITHUB_SHA::7}" \
            ./frontend
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push backend image
        run: docker push --all-tags "ghcr.io/${{ github.repository_owner }}/jabo-backend"
      - name: Push frontend image
        run: docker push --all-tags "ghcr.io/${{ github.repository_owner }}/jabo-frontend"
