name: CI Nightly (Full E2E)

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css123
          POSTGRES_DB: creativesoundstudio
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U css -d creativesoundstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries: 10
    env:
      DATABASE_URL: postgresql://css:css123@localhost:5432/creativesoundstudio
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-e2e-secret
      MAGIC_LINK_TTL_HOURS: "168"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css123
          POSTGRES_DB: creativesoundstudio
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U css -d creativesoundstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries: 10
    env:
      DATABASE_URL: postgresql://css:css123@localhost:5432/creativesoundstudio
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-e2e-secret
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-e2e-password
      MAGIC_LINK_TTL_HOURS: "168"
      BACKEND_LOG_FILE: /tmp/backend.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npx prisma db seed
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build
      - name: Start backend
        working-directory: backend
        run: node dist/index.js > /tmp/backend.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        run: npm run start &
      - name: Wait for services
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:4000/api/health && curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "Services failed to start within 180 seconds"
          exit 1
      - run: npx playwright test
        working-directory: frontend
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7